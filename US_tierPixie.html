<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tierPixie US</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --text:#1b1f24; --muted:#5f6b7a; --border:#dde2e8;
  --accent:#2f6fdb; --accent-soft:#e6eefc; --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fff2dc;
  --bad:#c23a3a; --bad-soft:#fde8e8; --infer:#6b4fbb; --infer-soft:#efeafb; --sel:#fff8d6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --panel:#1b1e23; --panel2:#23272e; --text:#e6e9ee; --muted:#9aa4b2; --border:#30353d;
    --accent:#6b9cff; --accent-soft:#1d2a44; --ok:#4cc27e; --ok-soft:#173326; --warn:#f0b44c; --warn-soft:#3a2c12;
    --bad:#ff7b7b; --bad-soft:#3d1c1c; --infer:#b39cff; --infer-soft:#2a2342; --sel:#3a3418;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --panel2:#23272e; --text:#e6e9ee; --muted:#9aa4b2; --border:#30353d;
  --accent:#6b9cff; --accent-soft:#1d2a44; --ok:#4cc27e; --ok-soft:#173326; --warn:#f0b44c; --warn-soft:#3a2c12;
  --bad:#ff7b7b; --bad-soft:#3d1c1c; --infer:#b39cff; --infer-soft:#2a2342; --sel:#3a3418;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:7px;padding:6px 14px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:background .12s,transform .05s}
button:hover{background:var(--accent-soft)}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.1);background:var(--accent)}
button.btn-infer{background:var(--infer);border-color:var(--infer);color:#fff}
button.btn-infer:hover{filter:brightness(1.1);background:var(--infer)}
button.btn-drop{border-color:var(--muted);color:var(--text)}
button.btn-drop:hover{background:var(--panel2)}
button.small{padding:4px 10px;font-size:13px}
button.ghost{border-color:transparent;background:transparent;box-shadow:none}
nav button,.seg button,.menu .pop button,.tok button{box-shadow:none;font-weight:inherit;color:inherit;border-width:1px}
.seg button{border-color:var(--border)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],textarea,select{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:6px 8px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:11px var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2);color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border)}
.hbar{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.hbar h1{font-size:17px;margin:0;white-space:nowrap}
.prog{flex:1;min-width:180px;max-width:420px}
.prog .bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.prog small{color:var(--muted)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;white-space:nowrap}
nav button.on{border-bottom-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600;text-align:center;background:var(--panel2);color:var(--muted)}
.badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
main{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
.intro{background:var(--accent-soft);border:1px solid var(--accent);border-left:6px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:14px;color:var(--text);font-size:15px;line-height:1.5}
.intro b{color:var(--accent)}
.dhead{position:sticky;top:var(--hh,94px);z-index:6;background:var(--panel);margin:-16px -16px 12px;padding:14px 16px 12px;border-bottom:1px solid var(--border);border-radius:8px 8px 0 0}
.decide{display:flex;gap:10px;align-items:center}
.decide .status{flex:1;min-width:0;padding:7px 12px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.status.match{background:var(--ok-soft);color:var(--ok)} .status.infer{background:var(--infer-soft);color:var(--infer)}
.status.drop{background:var(--panel2);color:var(--muted)} .status.pending{background:var(--warn-soft);color:var(--warn)}
.decide .dbtns{display:flex;gap:6px;flex:none}
.dbtns button.on{border-color:var(--accent);background:var(--accent-soft)}
details.more{margin-top:14px;border-top:1px solid var(--border);padding-top:8px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px}
.slot .top{justify-content:space-between}
.slot .right{display:flex;gap:6px;align-items:center;flex:none}
.split{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:14px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px}
.list{position:sticky;top:var(--hh,94px);max-height:calc(100vh - var(--hh,94px) - 16px);display:flex;flex-direction:column}
.list .tools{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:2px 8px;font-size:12px;border-radius:12px}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.items{overflow:auto;flex:1}
.item{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.item:hover{background:var(--panel2)} .item.on{background:var(--accent-soft)}
.item .nm{flex:1;min-width:0;word-break:break-word}
.item .meta{font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none;background:var(--warn)}
.dot.match{background:var(--ok)} .dot.infer{background:var(--infer)} .dot.drop{background:var(--muted)} .dot.none{background:var(--border)}
.lv{display:inline-block;font:11px var(--mono);padding:0 4px;border-radius:3px;background:var(--panel2);color:var(--muted);margin-right:3px}
.detail{padding:16px}
.detail h2{margin:0 0 4px;font-size:20px;word-break:break-word}
.section{margin-top:16px}
.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.banner{padding:8px 12px;border-radius:6px;margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.match{background:var(--ok-soft);color:var(--ok)} .banner.infer{background:var(--infer-soft);color:var(--infer)}
.banner.drop{background:var(--panel2);color:var(--muted)} .banner.pending{background:var(--warn-soft);color:var(--warn)}
.cand{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
.cand{align-items:center;transition:border-color .12s,box-shadow .12s}
.cand:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.12)} .cand.chosen{border-color:var(--ok);background:var(--ok-soft)}
.cand .pickbtn{display:inline-block;margin-top:4px;padding:5px 14px;border-radius:7px;border:1.5px solid var(--ok);color:var(--ok);font-weight:600;font-size:13px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cand:hover .pickbtn{background:var(--ok);color:#fff}
.cand.chosen .pickbtn{background:var(--ok);color:#fff}
.cand .n{font:12px var(--mono);color:var(--muted);padding-top:2px}
.cand .why{font-size:12px;color:var(--muted)}
.score{text-align:right;font-size:13px;font-weight:600;color:var(--muted)}
.score .sb{height:5px;background:var(--panel2);border-radius:3px;margin-top:4px;overflow:hidden}
.score .sb i{display:block;height:100%;background:var(--accent)}
.tier{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);color:var(--muted);margin-left:4px}
.tier.ok{background:var(--ok-soft);color:var(--ok)} .tier.off{background:var(--warn-soft);color:var(--warn)}
.warnline{font-size:12px;color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.occ{font-size:13px;margin:0;padding-left:18px} .occ li{margin:2px 0}
.cells{display:flex;flex-direction:column;gap:6px}
.cellrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.cellrow code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.tok{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:12px;font-size:12px;margin:2px 4px 2px 0;border:1px solid transparent;max-width:100%}
.tok.match{background:var(--ok-soft);color:var(--ok)} .tok.infer{background:var(--infer-soft);color:var(--infer)}
.tok.pending{background:var(--warn-soft);color:var(--warn)} .tok.drop{background:var(--panel2);color:var(--muted);text-decoration:line-through}
.tok button{border:none;background:none;padding:0 4px;color:inherit;font-size:13px;line-height:1}
.tok span{overflow:hidden;text-overflow:ellipsis}
.slotcards{display:flex;flex-direction:column;gap:10px}
.slot{padding:12px 14px;border-left:4px solid var(--border)}
.slot.on{border-left-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot.st-pending{border-left-color:var(--warn)} .slot.st-filled{border-left-color:var(--ok)} .slot.st-blank,.slot.st-nosug{border-left-color:var(--muted)}
.slot.on.st-pending,.slot.on.st-filled,.slot.on.st-blank,.slot.on.st-nosug{border-left-color:var(--accent)}
.slot .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pfx{color:var(--muted)}
.ctx{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--accent);border-radius:8px;padding:6px 10px;text-align:left;background:var(--panel);max-width:100%;color:var(--text);font-weight:400}
.chip:hover{background:var(--accent-soft);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.chip .lbl{font-size:11px;color:var(--muted);display:block}
.ed{position:relative;margin-top:8px}
.ac{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-height:320px;overflow:auto}
.ac div{padding:6px 10px;cursor:pointer;font-size:13px}
.ac div.hi,.ac div:hover{background:var(--accent-soft)}
.cluster{padding:12px 14px;margin-bottom:10px}
.cluster.done{border-color:var(--ok)}
.mem{display:grid;grid-template-columns:24px 24px 1fr auto;gap:6px;align-items:center;padding:3px 0;font-size:13px}
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);font-size:12px;z-index:5}
td.cellv{cursor:pointer;min-width:160px} td.cellv:hover{background:var(--accent-soft)}
.orig{font-size:11px;color:var(--muted);margin-top:2px}
.wl{font-size:12px;color:var(--warn);margin:0;padding-left:14px}
.tablewrap{overflow:auto;max-height:calc(100vh - var(--hh,94px) - 24px);border:1px solid var(--border);border-radius:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{padding:8px 14px;min-width:120px} .stat b{display:block;font-size:20px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px}
.modal{width:min(720px,100%);padding:18px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:60;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.menu{position:relative} .menu .pop{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:40;display:flex;flex-direction:column;min-width:220px;padding:4px}
.menu .pop button{border:none;text-align:left;background:none} .menu .pop button:hover{background:var(--accent-soft)}
.hidden,.menu .pop.hidden{display:none}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock.hidden{display:none}
#lock form{width:min(380px,100%);padding:28px;display:flex;flex-direction:column;gap:12px}
#lock h2{margin:0;font-size:22px}
#lock .err{min-height:0}
#lock .err:not(:empty){color:var(--bad);background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:7px;padding:8px 12px;font-weight:600;font-size:14px}
.nostore{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--warn);border-left:6px solid var(--warn);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:14.5px}
button.warnbtn{background:var(--warn);border-color:var(--warn);color:#fff}
button.warnbtn:hover{filter:brightness(1.1);background:var(--warn)}
.undonote{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)} .undonote b{color:var(--text)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:stretch}
.opts .chips{display:contents}
button.optbtn{padding:6px 14px;font-size:13px}
button.blankbtn{border:1.5px dashed var(--text);color:var(--text);background:var(--panel2)}
button.blankbtn:hover{background:var(--border)}
.current{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.statusp{font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px}
.statusp.pending{background:var(--warn-soft);color:var(--warn)} .statusp.filled{background:var(--ok-soft);color:var(--ok)}
.statusp.blank,.statusp.nosug{background:var(--panel2);color:var(--muted)}
button.stat{text-align:left;color:var(--text);font-weight:400;border:1px solid var(--border);background:var(--panel);padding:8px 14px;min-width:130px;font-size:13px}
button.stat:hover{border-color:var(--accent);background:var(--panel)}
button.stat.on{border:2px solid var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1 id="title">tierPixie</h1>
    <div class="prog" id="prog"></div>
    <div class="hbtns">
      <span class="muted" id="saved" style="font-size:12px;align-self:center"></span>
      <button id="undoBtn" data-act="undo" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
      <button class="primary" data-act="export">⬇ Export CSV</button>
      <div class="menu"><button data-act="menu">⋯</button>
        <div class="pop hidden" id="menuPop">
          <button data-act="saveProg">Save progress file (.json)…</button>
          <button data-act="loadProg">Load progress file…</button>
          <button data-act="openCsv">Open a different CSV…</button>
          <button data-act="forgetCode" id="forgetBtn" class="hidden">Forget access code on this device</button>
          <button data-act="reset" style="color:var(--bad)">Reset all decisions…</button>
        </div>
      </div>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<div id="modal"></div>
<div id="lock" class="hidden"><form class="card" id="lockForm">
  <h2>🔒 tierPixie · US</h2>
  <div class="muted">Enter the access code to open this tool.</div>
  <input type="password" id="lockPass" placeholder="Access code" autocomplete="current-password">
  <label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="lockRemember" checked> Remember on this device</label>
  <button class="primary" type="submit" id="lockBtn">Unlock</button>
  <div class="err" id="lockErr"></div>
</form></div>
<input type="file" id="fileCsv" accept=".csv,text/csv" class="hidden">
<input type="file" id="fileProg" accept=".json,application/json" class="hidden">

/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STOP = new Set(['the','of','for','and','in','on','to','a','an','fur','und','der','die','das','de','des','et','la','le','du','und']);
const deacc = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const norm = s => deacc(s).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
const key = norm;
const toks = s => norm(s).split(' ').filter(t => t && !STOP.has(t));
function initials(s, keepStop){ const w = norm(s).split(' ').filter(Boolean).filter(t => keepStop || !STOP.has(t)); return w.length >= 2 ? w.map(t => t[0]).join('') : ''; }
function trigrams(s){ const t = ' ' + s + ' ', o = new Set(); for (let i = 0; i < t.length - 2; i++) o.add(t.slice(i, i + 3)); return o; }
function diceSet(A, B){ if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => { if (B.has(x)) n++; }); return 2 * n / (A.size + B.size); }
const dice = (a, b) => diceSet(new Set(a), new Set(b));
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const isBlank = v => !v || /^\s*(NA|N\/A|null|none|-)?\s*$/i.test(v);
const PCOL = k => `tier_${k}_parent_name`;
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

function parseCSV(t){
  const rows = []; let row = [], f = '', q = false, i = 0;
  while (i < t.length){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; } f += c; i++; continue; }
    if (c === '"'){ q = true; i++; continue; }
    if (c === ','){ row.push(f); f = ''; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += c; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';

/* ---------- name features & similarity ---------- */
function feat(s){
  s = String(s);
  const full = norm(s);
  // split on ':' and keep each segment's bracketed text with it; a segment that is only brackets
  // (e.g. "BMUV: (Federal Ministry …)") belongs to the segment before it
  const segs = [];
  s.split(':').forEach(raw => {
    const parens = [...raw.matchAll(/\(([^()]*)\)/g)].map(m => m[1].trim());
    const core = raw.replace(/\([^()]*\)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!core && segs.length) segs[segs.length - 1].parens.push(...parens);
    else if (core || parens.length) segs.push({ core: core || parens.join(' '), parens });
  });
  if (!segs.length) segs.push({ core: s.trim(), parens: [] });
  const last = segs[segs.length - 1], self = last.core, selfN = norm(self);
  const shortTok = x => { const n = norm(x); return n && !n.includes(' ') && n.length <= 12 ? n : ''; };
  const acrS = new Set();   // explicit acronyms: bare token, “(ABC)”, “ABC - …”
  if (selfN && !selfN.includes(' ') && selfN.length <= 10) acrS.add(selfN);
  last.parens.forEach(p => { const n = shortTok(p); if (n) acrS.add(n); });
  const dash = self.match(/^(\S{2,10})\s+[-–]\s+/); if (dash) acrS.add(norm(dash[1]));
  const acr = new Set(acrS);  // plus acronyms built from initials (3+ letters, to avoid noise)
  [initials(self, true), initials(self, false)].forEach(x => { if (x.length >= 3) acr.add(x); });
  const prefixN = [];
  segs.slice(0, -1).forEach(g => { prefixN.push(norm(g.core)); g.parens.forEach(p => { const n = shortTok(p); if (n) prefixN.push(n); }); });
  const coreN = norm(segs.map(g => g.core).join(' : '));
  return { full, selfN, coreN, prefixN, tSelf: toks(self), tFull: toks(s), tri: trigrams(full), triSelf: trigrams(selfN), acr, acrS };
}
const featCache = new Map();
function F(s){ let f = featCache.get(s); if (!f){ f = feat(s); featCache.set(s, f); } return f; }

function sim(p, c){
  let s = 0, why = '';
  const up = (v, w) => { if (v > s){ s = v; why = w; } };
  if (p.full && p.full === c.full) up(1, 'exact name');
  if (p.coreN && p.coreN === c.coreN) up(0.97, 'same name, ignoring brackets');
  if (p.selfN && p.selfN === c.selfN) up(0.95, 'same name, ignoring prefix');
  if (p.full && (p.full === c.selfN || p.selfN === c.full)) up(0.95, 'same name, ignoring prefix');
  for (const a of p.acr) if (c.acr.has(a)) up(p.acrS.has(a) && c.acrS.has(a) ? 0.92 : 0.86, (c.acrS.has(a) ? 'acronym ' : 'initials ') + a.toUpperCase());
  up(0.9 * dice(p.tSelf, c.tSelf), 'shared words');
  up(0.85 * dice(p.tFull, c.tFull), 'shared words');
  up(0.85 * diceSet(p.tri, c.tri), 'similar spelling');
  up(0.85 * diceSet(p.triSelf, c.triSelf), 'similar spelling');
  const child = c.prefixN.some(x => x && (x === p.selfN || x === p.coreN || p.acr.has(x)));
  if (child) s *= 0.5;
  return { score: s, why, child };
}

/* ---------- data ---------- */
let CODE, FILE, CSVTEXT, HEAD, ROWS, ROWBY, BYID, INST, LEVELS, TIERCOL, HASH, S, UNDO = [];
const UI = { moreSug: {}, other: {}, det: {}, tab: 1, f1: 'pending', lv1: 'all', q1: '', sel1: null, cq: '', splitEdit: null, f2: 'pending', sel2: 0, f4: 'all', q4: '', modal: null, ac: null };
const candCache = new Map();

function tierOf(r){ const t = parseInt(r[TIERCOL], 10); return isNaN(t) ? 99 : t; }
function blankState(){ return { decisions: {}, overrides: {}, blankDone: {}, splits: {}, canon: {}, hSplit: {}, hMerge: [], hConfirmed: {} }; }
const storeKey = () => `parent-matcher:${CODE}:${HASH}`;
// Some hosts (e.g. the Dropbox web preview) sandbox the page and block browser storage.
// Then nothing autosaves, so keep a visible Save button and warn before leaving with unsaved work.
const STORAGE_OK = (() => { try { localStorage.setItem('__tp', '1'); localStorage.removeItem('__tp'); return true; } catch (e){ return false; } })();
let UNSAVED = 0, SAVED_TO_FILE = false;
function writeLocal(){
  if (!STORAGE_OK) return false;
  try { localStorage.setItem(storeKey(), JSON.stringify(S)); return true; } catch (e){ return false; }
}
function save(){
  S._ts = Date.now();
  const local = writeLocal();
  if (SYNC) return queueSync();
  if (local){ $('#saved').textContent = 'Autosaved in this browser · ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); return; }
  UNSAVED++; showSaveState();
}
function showSaveState(){
  if (STORAGE_OK || SYNC) return;
  $('#saved').innerHTML = `<button class="warnbtn" data-act="saveProg">${UNSAVED ? `⚠ ${UNSAVED} unsaved change${UNSAVED > 1 ? 's' : ''}: save progress` : SAVED_TO_FILE ? '✓ Progress saved to file' : 'Save progress'}</button>`;
}
window.addEventListener('beforeunload', ev => { if ((!STORAGE_OK && !SYNC && UNSAVED) || SYNC_PENDING){ ev.preventDefault(); ev.returnValue = ''; } });
function loadStored(){ try { const v = localStorage.getItem(storeKey()); return v ? Object.assign(blankState(), JSON.parse(v)) : null; } catch (e){ return null; } }

function init(code, file, text){
  CODE = code; FILE = file; CSVTEXT = text.replace(/^﻿/, '');
  const t = parseCSV(CSVTEXT);
  HEAD = t[0].map(h => h.trim());
  ROWS = t.slice(1).filter(r => r.some(c => c.trim())).map(r => { const o = {}; HEAD.forEach((h, i) => o[h] = (r[i] ?? '').trim()); return o; });
  TIERCOL = HEAD.find(h => /^tier(_\d)+$/.test(h)) || 'tier_1_2_3';
  LEVELS = HEAD.map(h => h.match(/^tier_(\d+)_parent_name$/)).filter(Boolean).map(m => +m[1]).sort((a, b) => a - b);
  ROWBY = {}; ROWS.forEach(r => ROWBY[r.unique_id] = r);
  INST = ROWS.map(r => ({ id: r.unique_id, name: r.institution_name, tier: tierOf(r), f: feat(r.institution_name) }));
  BYID = {}; INST.forEach(i => BYID[i.id] = i);
  HASH = hash(CSVTEXT); candCache.clear(); featCache.clear();
  S = loadStored() || blankState(); UNDO = []; UNSAVED = 0; showSaveState();
  UI.sel1 = null; UI.sel2 = 0;
  document.title = `tierPixie · ${CODE}`;
  $('#title').innerHTML = `tierPixie · ${esc(CODE)} <span class="muted" style="font-weight:400;font-size:13px">${esc(FILE)} · ${ROWS.length} institutions</span>`;
  render();
}

/* cells → entries ({name} raw text, or {id} direct institution) */
function splitCell(text){
  const sp = S.splits[key(text)];
  if (sp) return sp.slice();
  const out = [];
  text.split(';').forEach(seg => {
    let depth = 0, cur = '';
    for (const ch of seg){
      if (ch === '(') depth++; else if (ch === ')') depth = Math.max(0, depth - 1);
      if (ch === ',' && depth === 0){ out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur);
  });
  const res = [];
  out.map(x => x.trim()).filter(Boolean).forEach(x => {
    if (res.length && /^(phase|and|inc|ltd|gmbh|llc)\b|^\d/i.test(x)) res[res.length - 1] += ', ' + x; else res.push(x);
  });
  return res;
}
function cellParts(r, k){
  const ov = S.overrides[r.unique_id]?.[k];
  if (ov) return ov;
  const v = r[PCOL(k)];
  if (isBlank(v)) return [];
  return splitCell(v).map(n => ({ name: n }));
}
function resolve(e){
  if (e.id){ return { status: 'match', id: e.id, name: BYID[e.id]?.name ?? e.id, direct: true }; }
  const k = key(e.name), d = S.decisions[k];
  if (!d) return { status: 'pending', name: e.name, key: k };
  if (d.type === 'match') return { status: 'match', id: d.id, name: BYID[d.id]?.name ?? d.id, via: e.name };
  if (d.type === 'drop') return { status: 'drop', name: e.name, key: k };
  return { status: 'infer', name: S.canon[k] ?? e.name, raw: e.name, key: k };
}
const rsig = x => x.status === 'match' ? 'id:' + x.id : x.status === 'infer' ? 'n:' + key(x.name) : 'p:' + key(x.name);
function resolvedCell(r, k){
  const seen = new Set(), out = [];
  cellParts(r, k).map(resolve).filter(x => x.status !== 'drop').forEach(x => { const s = rsig(x); if (!seen.has(s)){ seen.add(s); out.push(x); } });
  return out;
}

function buildPool(){
  const pool = new Map();
  for (const r of ROWS) for (const k of LEVELS) cellParts(r, k).forEach(e => {
    if (e.id) return;
    const kk = key(e.name); if (!kk) return;
    let p = pool.get(kk);
    if (!p){ p = { key: kk, name: e.name, variants: new Set(), occ: [], levels: new Set() }; pool.set(kk, p); }
    p.variants.add(e.name); p.occ.push({ id: r.unique_id, k }); p.levels.add(k);
  });
  return pool;
}
function candidates(name, levels){
  const ck = name + '§' + [...levels].sort().join(',');
  if (candCache.has(ck)) return candCache.get(ck);
  const p = F(name);

/* ---------- blank-cell suggestions ---------- */
const SEGSPLIT = /\s*(?:\/|&|,\s*and\s+|,|\s+and\s+)\s*/i;

function suggestions(r, k){
  const t = tierOf(r), id = r.unique_id, out = [], seen = new Set();
  const push = (entries, label, detail) => {
    if (!entries.length) return;
    const sig = entries.map(e => rsig(resolve(e))).sort().join('|');
    if (seen.has(sig)) return; seen.add(sig); out.push({ entries, label, detail });
  };
  const fromSeg = seg => seg.split(SEGSPLIT).map(s => s.trim()).filter(Boolean).map(part => {
    const b = candidates(part, new Set([k])).find(x => x.c.id !== id && !x.child);
    return b && b.score >= 0.8 ? { id: b.c.id } : { name: part };
  });
  const prefix = segsOf(r.institution_name).slice(0, -1);
  const idx = prefix.length - (t - k);
  if (idx >= 0 && idx < prefix.length) push(fromSeg(prefix[idx]), `From name prefix “${prefix[idx]}”`, 'position in the name matches this tier');
  for (const j of LEVELS){
    if (j <= k) continue;
    for (const x of resolvedCell(r, j)){
      if (x.status !== 'match' || !ROWBY[x.id]) continue;
      const parts = cellParts(ROWBY[x.id], k);
      if (parts.length) push(parts.map(e => ({ ...e })), `Inherited from ${x.id}`, `its tier_${k} parent (it is this row’s tier_${j} parent)`);
    }

      if (op.length < sp.length || sp.some((s, i) => s !== op[i])) continue;
      const parts = cellParts(o, k); if (!parts.length) continue;

      const c = counts.get(sig) || { n: 0, parts }; c.n++; counts.set(sig, c);
    }

      .forEach(c => push(c.parts.map(e => ({ ...e })), `Used by ${c.n} similar row${c.n > 1 ? 's' : ''}`, `rows also named “${sp.join(': ')}: …”`));

  const out = [];

    const t = tierOf(r);

      if (k >= t || !isBlank(r[PCOL(k)])) continue;
      const sk = r.unique_id + '|' + k, ov = S.overrides[r.unique_id]?.[k];

}

/* ---------- harmonising inferred names ---------- */
function related(a, b){
  if (a.coreN && a.coreN === b.coreN) return true;
  if (a.selfN && a.selfN === b.selfN) return true;
  for (const x of a.acr) if (b.acr.has(x)) return true;
  if (dice(a.tFull, b.tFull) >= 0.75) return true;
  if (diceSet(a.tri, b.tri) >= 0.8) return true;
  return false;
}
function clusters(pool){
  pool = pool || buildPool();
  const inf = [...pool.values()].filter(p => S.decisions[p.key]?.type === 'infer');
  const par = {}; inf.forEach(p => par[p.key] = p.key);
  const find = x => par[x] === x ? x : (par[x] = find(par[x]));
  const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[a] = b; };
  for (let i = 0; i < inf.length; i++) for (let j = i + 1; j < inf.length; j++){
    const a = inf[i], b = inf[j];
    if (S.hSplit[a.key] || S.hSplit[b.key]) continue;
    if (related(F(a.name), F(b.name))) uni(a.key, b.key);
  }
  S.hMerge.forEach(([a, b]) => { if (par[a] && par[b]) uni(a, b); });
  const g = new Map();
  inf.forEach(p => { const r = find(p.key); if (!g.has(r)) g.set(r, []); g.get(r).push(p); });
  return [...g.values()].map(members => {
    members.sort((a, b) => b.occ.length - a.occ.length || b.name.length - a.name.length);
    const sig = members.map(m => m.key).sort().join('§');
    const canons = new Set(members.map(m => S.canon[m.key] ?? m.name));
    const current = canons.size === 1 ? [...canons][0] : members[0].name;
    return { sig, members, current, done: members.length < 2 || !!S.hConfirmed[sig] };

}

/* ---------- validation ---------- */
function warnings(r){
  const w = [], t = tierOf(r), lv = {};
  LEVELS.forEach(k => lv[k] = resolvedCell(r, k));
  for (const k of LEVELS){
    if (lv[k].some(x => x.status === 'pending')) w.push(`tier_${k}: name not yet decided`);
    if (lv[k].length && k >= t) w.push(`tier_${k} parent given for a tier-${t} institution`);
    lv[k].forEach(x => {
      if (x.status !== 'match') return;
      if (x.id === r.unique_id) w.push(`tier_${k}: points to itself`);
      else if (BYID[x.id] && BYID[x.id].tier !== k) w.push(`tier_${k} parent ${x.id} is a tier-${BYID[x.id].tier} institution`);
    });
    if (k < t && !lv[k].length && isBlank(r[PCOL(k)]) && !S.overrides[r.unique_id]?.[k] && !S.blankDone[r.unique_id + '|' + k] && suggestions(r, k).length) w.push(`tier_${k}: blank, suggestion not reviewed`);
  }
  for (const j of LEVELS) for (const x of lv[j]){
    if (x.status !== 'match' || !ROWBY[x.id] || x.id === r.unique_id) continue;
    for (const i of LEVELS){
      if (i >= j) continue;
      const mine = new Set(lv[i].map(rsig)), theirs = new Set(resolvedCell(ROWBY[x.id], i).map(rsig));
      if (mine.size && theirs.size && (mine.size !== theirs.size || [...mine].some(s => !theirs.has(s))))
        w.push(`tier_${i} differs from the tier_${i} parent of ${x.id}`);
    }
  }

}

        ${!isBlank(orig) || ov ? `<div class="orig">${ov ? '✎ edited · ' : ''}orig: ${isBlank(orig) ? 'blank' : esc(orig)}</div>` : ''}</td>`; }).join('')}

/* ---------- export / files ---------- */
function cleanCell(r, k){
  const v = resolvedCell(r, k);
  if (!v.length) return { name: 'NA', id: 'NA' };
  return { name: v.map(x => x.name).join('; '), id: v.map(x => x.status === 'match' ? x.id : 'NA').join('; ') };
}
// What happened to one parent slot, so the sheet shows reviewed vs not yet looked at.
// open: true while the slot still needs a decision.
function slotStatus(r, k){
  const sk = r.unique_id + '|' + k, ov = S.overrides[r.unique_id]?.[k];
  const parts = cellParts(r, k).map(resolve);
  if (parts.some(x => x.status === 'pending')) return { text: 'undecided', open: true };
  if (ov && !ov.length) return { text: 'made blank', open: false };
  if (!parts.length){
    if (k >= tierOf(r)) return { text: 'not applicable', open: false, none: true };
    if (S.blankDone[sk]) return { text: 'left blank (reviewed)', open: false };
    if (suggestions(r, k).length) return { text: 'blank, suggestion not reviewed', open: true };
    return { text: 'blank, nothing to suggest', open: false, none: true };
  }
  const kinds = [...new Set(parts.map(x => ({ match: 'matched', infer: 'kept as new parent', drop: 'dropped' })[x.status]))];
  return { text: (ov ? 'edited: ' : '') + kinds.join(' + '), open: false };
}
function buildTable(){
  const head = [...HEAD, 'review_status']; LEVELS.forEach(k => head.push(`tier_${k}_parent_name_clean`, `tier_${k}_parent_id`, `tier_${k}_parent_status`)); head.push('parent_match_warnings');
  return [head, ...ROWS.map(r => {
    const out = HEAD.map(h => r[h]), st = LEVELS.map(k => slotStatus(r, k));
    out.push(st.some(s => s.open) ? 'OPEN: needs input' : st.every(s => s.none) ? 'nothing to decide' : 'done');
    LEVELS.forEach((k, i) => { const c = cleanCell(r, k); out.push(c.name, c.id, st[i].text); });
    out.push(warnings(r).join(' | ') || 'NA');
    return out;
  })];
}
function buildCSV(){ return buildTable().map(row => row.map(csvCell).join(',')).join('\n') + '\n'; }
async function saveFile(name, text, mime, desc, ext){
  if (window.showSaveFilePicker){
    try {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: desc, accept: { [mime]: [ext] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close(); toast('Saved ' + h.name); return;
    } catch (e){ if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Downloaded ' + name);
}
function doExport(){
  const open = ST.p1 + ST.p2 + ST.p3;
  if (open && !confirm(`${open} decision(s) are still open. Undecided names are exported as written, with id “NA” and a warning. Export anyway?`)) return;
  saveFile(`${CODE}_parents_matched.csv`, buildCSV(), 'text/csv', 'CSV', '.csv');
}

/* ---------- events ---------- */
function handle(action, el, ev){
  const d = el.dataset;
  switch (action){
    case 'tab': UI.tab = +d.v; UI.ac = null; render(); window.scrollTo(0, 0); break;
    case 'menu': $('#menuPop').classList.toggle('hidden'); return;
    case 'undo': undo(); break;
    case 'export': doExport(); break;
    case 'saveProg': UNSAVED = 0; SAVED_TO_FILE = true; showSaveState(); saveFile(`${CODE}_tierPixie_progress.json`, JSON.stringify({ code: CODE, hash: HASH, state: S }, null, 1), 'application/json', 'JSON', '.json'); break;
    case 'loadProg': $('#fileProg').click(); break;
    case 'openCsv': $('#fileCsv').click(); break;
    case 'help': alert(HELP); break;
    case 'reset': if (confirm('Delete every decision for this file? (You can still Undo.)')) act(() => { const s = blankState(); Object.keys(S).forEach(k => delete S[k]); Object.assign(S, s); }); break;
    case 'f1': UI.f1 = d.v; UI.sel1 = null; render(); break;
    case 'lv1': UI.lv1 = d.v; UI.sel1 = null; render(); break;
    case 'sel1': UI.sel1 = d.k; UI.cq = ''; UI.splitEdit = null; UI.occAll = false; UI.keep = true; render(); break;
    case 'pick': decide({ type: 'match', id: d.id }); break;
    case 'infer': decide({ type: 'infer' }); break;
    case 'drop': decide({ type: 'drop' }); break;
    case 'clear': UI.keep = true; decide(null); break;
    case 'occAll': UI.occAll = !UI.occAll; UI.keep = true; render(); break;
    case 'bulkExact': {
      const pend = ST.names.filter(n => nameStatus(n.key) === 'pending');
      const ex = pend.map(n => [n, candidates(n.name, n.levels)]).filter(([n, c]) => c[0] && c[0].score >= 0.95 && c[0].tierOk && !c[0].child && !(c[1] && c[1].score >= 0.95));
      if (confirm('Accept these matches?\n\n' + ex.map(([n, c]) => `${n.name}  →  ${c[0].c.id} ${c[0].c.name}`).join('\n'))) act(() => ex.forEach(([n, c]) => S.decisions[n.key] = { type: 'match', id: c[0].c.id }));
      break;
    }
    case 'bulkLow': {
      const pend = ST.names.filter(n => nameStatus(n.key) === 'pending');
      const lo = pend.filter(n => { const c = candidates(n.name, n.levels); return !c[0] || c[0].score < 0.45; });
      if (confirm('Mark these as new (inferred) parents? Their best candidate scores under 45%.\n\n' + lo.map(n => n.name).join('\n'))) act(() => lo.forEach(n => S.decisions[n.key] = { type: 'infer' }));
      break;
    }
    case 'editSplit': UI.splitEdit = d.cell; UI.keep = true; render(); $('#splitTa')?.focus(); break;
    case 'cancelSplit': UI.splitEdit = null; UI.keep = true; render(); break;
    case 'saveSplit': { const lines = $('#splitTa').value.split('\n').map(s => s.trim()).filter(Boolean); const ct = UI.splitEdit; UI.splitEdit = null; UI.keep = true; act(() => { S.splits[key(ct)] = lines; }); break; }
    case 'autoSplit': { const ct = UI.splitEdit; UI.splitEdit = null; UI.keep = true; act(() => { delete S.splits[key(ct)]; }); break; }
    case 'f2': UI.f2 = d.v; UI.sel2 = 0; render(); break;
    case 'sel2': if (UI.sel2 !== +d.v){ UI.sel2 = +d.v; render(); } return;
    case 'chip': { const [rowId, k] = d.sk.split('|'); const s = suggestions(ROWBY[rowId], +k)[+d.i]; act(() => { setOverride(rowId, +k, s.entries.map(e => ({ ...e }))); delete S.blankDone[d.sk]; }); break; }
    case 'leaveBlank': { const [rowId, k] = d.sk.split('|'); act(() => { clearOverride(rowId, +k); S.blankDone[d.sk] = true; }); break; }
    case 'resetSlot': { const [rowId, k] = d.sk.split('|'); act(() => { clearOverride(rowId, +k); delete S.blankDone[d.sk]; }); break; }
    case 'clearSlot': { const [rowId, k] = d.sk.split('|'); act(() => setOverride(rowId, +k, [])); break; }
    case 'rmEntry': { const [rowId, k] = d.sk.split('|'); const cur = cellParts(ROWBY[rowId], +k).slice(); cur.splice(+d.i, 1); act(() => setOverride(rowId, +k, cur.map(e => ({ ...e })))); break; }
    case 'acPick': acPick(d.sk, +d.i); break;
    case 'hConfirm': { const g = ST.cl.find(c => c.sig === d.sig); setGroupCanon(d.sig, g.current); break; }
    case 'f4': UI.f4 = d.v; render(); break;
    case 'forgetCode': try { localStorage.removeItem(PASSKEY()); } catch (e){} location.reload(); break;
    case 'syncRetry': clearTimeout(SYNC_TIMER); syncStart(); break;
    case 'dismissNoStore': UI.noStoreDismissed = true; render(); break;
    case 'moreSug': UI.moreSug[d.sk] = true; render(); break;
    case 'other': UI.other[d.sk] = !UI.other[d.sk]; render(); if (UI.other[d.sk]) $(`#ac-${CSS.escape(d.sk)}`)?.focus(); break;
    case 'cell': UI.modal = d.sk; UI.ac = null; render(); $(`#ac-${CSS.escape(d.sk)}`)?.focus(); break;
    case 'closeModal': if (ev.target === el){ UI.modal = null; UI.ac = null; render(); } break;
  }
  if (action !== 'menu') $('#menuPop').classList.add('hidden');
}
function acPick(sk, i){
  const it = UI.ac?.items?.[i]; if (!it) return;
  const [rowId, k] = sk.split('|');
  const cur = cellParts(ROWBY[rowId], +k).map(e => ({ ...e }));
  cur.push(it.id ? { id: it.id } : { name: it.name });
  UI.ac = { sk, q: '', hi: 0 };
  act(() => { setOverride(rowId, +k, cur); delete S.blankDone[sk]; });
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el){ $('#menuPop').classList.add('hidden'); return; }
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  if (el.dataset.act === 'closeModal' && ev.target.closest('[data-stop]') && el.classList.contains('modalbg')) return;
  handle(el.dataset.act, el, ev);
});

  else if (el.classList.contains('acin')){ UI.ac = { sk: el.dataset.sk, q: el.value, hi: 0 }; render(); }
});
document.addEventListener('keydown', ev => {
  const el = ev.target, inField = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'z' && !inField){ ev.preventDefault(); undo(); return; }
  if (el.classList && el.classList.contains('acin') && UI.ac){
    const n = UI.ac.items?.length || 0;
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); UI.ac.hi = Math.min(n - 1, (UI.ac.hi || 0) + 1); render(); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); UI.ac.hi = Math.max(0, (UI.ac.hi || 0) - 1); render(); }
    else if (ev.key === 'Enter' && n && UI.ac.q.trim()){ ev.preventDefault(); acPick(UI.ac.sk, UI.ac.hi || 0); }
    else if (ev.key === 'Escape'){ UI.ac = null; render(); el.blur(); }
    return;
  }
  if (el.classList && el.classList.contains('hcustom') && ev.key === 'Enter'){ setGroupCanon(el.dataset.sig, el.value); return; }
  if (el.id === 'cq' && ev.key === 'Enter'){ const f = $('.cand'); if (f) handle('pick', f, ev); return; }
  if (ev.key === 'Escape'){
    if (UI.modal){ UI.modal = null; UI.ac = null; render(); return; }
    if (inField){ el.blur(); return; }
  }
  if (inField || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (UI.tab === 1){
    const list = visibleNames(), i = list.findIndex(n => n.key === UI.sel1);
    if (k === 'ArrowDown' || k === 'j'){ ev.preventDefault(); const n = list[Math.min(list.length - 1, i + 1)]; if (n){ UI.sel1 = n.key; UI.cq = ''; UI.keep = true; UI.scroll = true; render(); } }
    else if (k === 'ArrowUp' || k === 'k'){ ev.preventDefault(); const n = list[Math.max(0, i - 1)]; if (n){ UI.sel1 = n.key; UI.cq = ''; UI.keep = true; UI.scroll = true; render(); } }
    else if (/^[1-9]$/.test(k)){ const c = document.querySelectorAll('.cand')[+k - 1]; if (c) decide({ type: 'match', id: c.dataset.id }); }
    else if (k === 'Enter'){ const c = $('.cand'); if (c) decide({ type: 'match', id: c.dataset.id }); }
    else if (k === 'n'){ decide({ type: 'infer' }); }
    else if (k === 'x'){ decide({ type: 'drop' }); }
    else if (k === 'u'){ UI.keep = true; decide(null); }
    else if (k === '/'){ ev.preventDefault(); $('#cq')?.focus(); }

  }
});
const HELP = `Keyboard shortcuts

Tab 1 · Match parent names
  ↑ ↓ / j k   previous / next name
  1–9         pick that candidate
  Enter       pick the top candidate
  n           no match → new (inferred) parent
  x           drop (not a parent, e.g. a URL)
  u           clear the decision
  /           search all institutions

Tab 2 · Fill blank parents
  j k         previous / next cell
  1–9         use that suggestion
  b           leave blank
  /           type a parent (↑ ↓ Enter in the dropdown)

Anywhere
  Ctrl/Cmd+Z  undo
  Esc         close dialog / leave a text box

Progress autosaves in this browser. Use ⋯ → “Save progress file” to keep a copy or move to another computer.`;

$('#fileCsv').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  const text = await f.text(); init(f.name.replace(/\.csv$/i, '').replace(/[^A-Za-z0-9_-]+/g, '_'), f.name, text); ev.target.value = '';
});
$('#fileProg').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.code !== CODE && !confirm(`This progress file is for “${j.code}”, not “${CODE}”. Load it anyway?`)) return;
    if (j.hash !== HASH && !confirm('The CSV has changed since this progress was saved. Decisions are keyed by name, so most will still apply. Load it?')) return;
    act(() => { Object.keys(S).forEach(k => delete S[k]); Object.assign(S, blankState(), j.state); });
    toast('Progress loaded');
  } catch (e){ alert('Could not read that file: ' + e.message); }
  ev.target.value = '';
});

/* ---------- access code: the CSV is AES-GCM encrypted with a key derived from the code ---------- */
const PASSKEY = () => 'tierPixie-pass:' + EMBED.code;
async function decryptCSV(pass){
  const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0)), e = EMBED.enc;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(e.salt), iterations: e.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(e.iv) }, k, b(e.ct)));
}
/* ---------- autosave to the project owner's Google Sheet ----------
   The sheet's web-app address and token travel inside the encrypted payload, so only people with
   the access code can reach it. One person works on a dataset at a time; the newest save wins. */
let SYNC = null, SYNC_TIMER = null, SYNC_PENDING = false, SYNC_READY = false, SYNC_FAILS = 0, SYNC_SEQ = 0;
function unpack(text){ try { const o = JSON.parse(text); if (o && typeof o.csv === 'string') return o; } catch (e){} return { csv: text }; }
function startWith(text){
  const o = unpack(text);
  SYNC = o.sync && o.sync.url ? o.sync : null;
  init(EMBED.code, EMBED.file, o.csv);
  if (SYNC) syncStart();
}
const syncStatus = html => { $('#saved').innerHTML = html; };
const okText = ts => `<span style="color:var(--ok);font-weight:600">✓ Saved</span> · ${new Date(ts || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
function syncWait(html){
  let d = $('#syncwait');
  if (html == null){ if (d) d.remove(); return; }
  if (!d){ d = document.createElement('div'); d.id = 'syncwait'; d.className = 'modalbg'; d.style.alignItems = 'center'; d.style.background = 'var(--bg)'; document.body.appendChild(d); }
  d.innerHTML = `<div class="card modal" style="width:min(440px,100%);display:flex;flex-direction:column;gap:12px;text-align:center">${html}</div>`;
}
async function syncStart(){
  syncStatus('Loading saved work…');
  syncWait('<h2 style="margin:0;font-size:20px">Connecting to the results sheet…</h2><div class="muted">Loading the latest saved work.</div>');
  try {
    const r = await (await fetch(`${SYNC.url}?dataset=${encodeURIComponent(CODE)}&token=${encodeURIComponent(SYNC.token)}`)).json();
    if (!r.ok) throw new Error(r.error || 'error');
    const remoteTs = (r.state && r.state._ts) || 0;
    if (remoteTs > (S._ts || 0)){
      S = Object.assign(blankState(), r.state); UNDO = []; writeLocal(); render();
      toast('Loaded the latest saved work');
    }
    SYNC_READY = true; SYNC_FAILS = 0; syncWait(null);
    if ((S._ts || 0) > remoteTs) queueSync(); else { SYNC_PENDING = false; syncStatus(okText(remoteTs || Date.now())); }
  } catch (e){
    // Never save before the sheet's copy has been read: retry the LOAD, keep local edits pending
    SYNC_READY = false;
    const wait = Math.min(60000, 5000 * 2 ** SYNC_FAILS++);
    syncStatus(`<span style="color:var(--warn);font-weight:600" title="${esc(String(e && e.message || e))}">⚠ Can’t reach the results sheet</span> · retrying`);
    syncWait(`<h2 style="margin:0;font-size:20px">⚠ Can’t reach the results sheet</h2>
      <div class="muted">Your work is saved there, so the tool waits until it can load it. It will try again in ${Math.round(wait / 1000)} seconds. Check your internet connection, or try another browser.</div>
      <div class="muted" style="font-size:12px">Reason: ${esc(String(e && e.message || e))}</div>
      <button class="primary" data-act="syncRetry">Try again now</button>`);
    clearTimeout(SYNC_TIMER); SYNC_TIMER = setTimeout(syncStart, wait);
  }
}
function queueSync(){
  SYNC_PENDING = true; SYNC_SEQ++;
  if (!SYNC_READY) return;
  syncStatus('Saving…');
  clearTimeout(SYNC_TIMER); SYNC_TIMER = setTimeout(doSync, 1200);
}
function syncPayload(){
  return JSON.stringify({ token: SYNC.token, dataset: CODE, state: S, results: buildTable(),
    decided: ST ? ST.done : 0, open: ST ? ST.p1 + ST.p2 + ST.p3 : 0 });
}
async function doSync(){
  const seq = SYNC_SEQ;
  try {
    const r = await (await fetch(SYNC.url, { method: 'POST', body: syncPayload() })).json();
    if (!r.ok) throw new Error(r.error || 'error');
    SYNC_FAILS = 0;
    if (seq === SYNC_SEQ){ SYNC_PENDING = false; syncStatus(okText()); }
  } catch (e){
    syncStatus(`<span style="color:var(--warn);font-weight:600" title="${esc(String(e && e.message || e))}">⚠ Not saved yet</span> · retrying`);
    retrySync();
  }
}
function retrySync(){ clearTimeout(SYNC_TIMER); SYNC_TIMER = setTimeout(doSync, Math.min(60000, 5000 * 2 ** SYNC_FAILS++)); }
window.addEventListener('pagehide', () => {
  if (SYNC && SYNC_PENDING && SYNC_READY && navigator.sendBeacon) navigator.sendBeacon(SYNC.url, new Blob([syncPayload()], { type: 'text/plain' }));
});

async function boot(){
  if (!EMBED.enc) return startWith(EMBED.csv);
  $('#forgetBtn').classList.remove('hidden');
  const lock = $('#lock'); lock.classList.remove('hidden');
  if (!window.crypto || !crypto.subtle){ $('#lockErr').textContent = 'This browser can’t decrypt here. Open the page over https or from your computer.'; return; }
  let saved = null; try { saved = localStorage.getItem(PASSKEY()); } catch (e){}
  if (saved){ try { const csv = await decryptCSV(saved); lock.classList.add('hidden'); return startWith(csv); } catch (e){} }
  $('#lockPass').focus();
  $('#lockForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const raw = $('#lockPass').value; $('#lockErr').textContent = ''; $('#lockBtn').disabled = true; $('#lockBtn').textContent = 'Checking…';
    let csv = null, pass = raw;
    for (const p of [...new Set([raw, raw.trim()])]){ try { csv = await decryptCSV(p); pass = p; break; } catch (e){} }
    try {
      if (csv === null) throw new Error('bad code');
      if ($('#lockRemember').checked){ try { localStorage.setItem(PASSKEY(), pass); } catch (e){} }
      lock.classList.add('hidden'); startWith(csv);
    } catch (e){ $('#lockErr').textContent = '✕ That code didn’t work. Check it and try again.'; $('#lockPass').select(); }
    $('#lockBtn').disabled = false; $('#lockBtn').textContent = 'Unlock';
  });
}
boot();
